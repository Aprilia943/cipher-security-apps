<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher Security App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header Navigation -->
    <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-shield-halved text-emerald-400 text-2xl"></i>
                <h1 class="font-bold text-xl tracking-wide text-white">Cipher Security Apps</h1>
            </div>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full font-mono">v1.0.0 Live</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8 w-full flex-grow">
        <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 md:p-8 shadow-xl backdrop-blur-sm">
            
            <!-- Controls Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <!-- Cipher Method -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Metode Cipher</label>
                    <select id="algoSelect" onchange="toggleKeyInput()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 focus:outline-none focus:border-emerald-500">
                        <option value="caesar">Caesar Cipher (Shift)</option>
                        <option value="vigenere">Vigenère Cipher (Key String)</option>
                        <option value="atbash">Atbash Cipher (Monoalphabetic)</option>
                    </select>
                </div>

                <!-- Shift / Key Input -->
                <div id="keyContainer">
                    <label id="keyLabel" class="block text-sm font-medium text-slate-300 mb-2">Pergeseran / Shift (Angka)</label>
                    <input type="number" id="caesarKey" value="3" min="1" max="25" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 focus:outline-none focus:border-emerald-500">
                    <input type="text" id="vigenereKey" placeholder="Masukkan kata kunci (ex: SECRET)" class="hidden w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <!-- Input Textarea -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-300 mb-2">Pesan Teks / Plaintext</label>
                <textarea id="inputText" rows="4" placeholder="Ketik atau tempelkan teks yang ingin diproses..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-4 text-slate-200 focus:outline-none focus:border-emerald-500 font-mono text-sm resize-none"></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-3 mb-6">
                <button onclick="processText('encrypt')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-4 rounded-lg transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-900/20">
                    <i class="fa-solid fa-lock"></i> Enkripsi
                </button>
                <button onclick="processText('decrypt')" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 px-4 rounded-lg transition-all flex items-center justify-center gap-2 shadow-lg shadow-indigo-900/20">
                    <i class="fa-solid fa-lock-open"></i> Dekripsi
                </button>
            </div>

            <!-- Output Textarea -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-medium text-slate-300">Hasil / Ciphertext</label>
                    <button onclick="copyOutput()" class="text-xs text-emerald-400 hover:text-emerald-300 flex items-center gap-1 bg-emerald-500/10 px-2.5 py-1 rounded border border-emerald-500/20">
                        <i class="fa-regular fa-copy"></i> Salin
                    </button>
                </div>
                <textarea id="outputText" readonly rows="4" placeholder="Hasil enkripsi atau dekripsi akan muncul di sini..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-4 text-emerald-400 font-mono text-sm resize-none focus:outline-none"></textarea>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>© 2026 Cipher Security App. Built for Web Cryptography Learning.</p>
    </footer>

    <!-- Cipher Logic JavaScript -->
    <script>
        function toggleKeyInput() {
            const algo = document.getElementById('algoSelect').value;
            const keyLabel = document.getElementById('keyLabel');
            const caesarKey = document.getElementById('caesarKey');
            const vigenereKey = document.getElementById('vigenereKey');

            if (algo === 'caesar') {
                keyLabel.classList.remove('hidden');
                keyLabel.textContent = 'Pergeseran / Shift (Angka)';
                caesarKey.classList.remove('hidden');
                vigenereKey.classList.add('hidden');
            } else if (algo === 'vigenere') {
                keyLabel.classList.remove('hidden');
                keyLabel.textContent = 'Kata Kunci / Key (Huruf)';
                caesarKey.classList.add('hidden');
                vigenereKey.classList.remove('hidden');
            } else {
                keyLabel.classList.add('hidden');
                caesarKey.classList.add('hidden');
                vigenereKey.classList.add('hidden');
            }
        }

        function processText(action) {
            const algo = document.getElementById('algoSelect').value;
            const input = document.getElementById('inputText').value;
            let result = '';

            if (algo === 'caesar') {
                const shift = parseInt(document.getElementById('caesarKey').value) || 0;
                result = caesarCipher(input, action === 'encrypt' ? shift : -shift);
            } else if (algo === 'vigenere') {
                const key = document.getElementById('vigenereKey').value;
                if (!key) { alert('Silakan masukkan kata kunci Vigenère!'); return; }
                result = vigenereCipher(input, key, action);
            } else if (algo === 'atbash') {
                result = atbashCipher(input);
            }

            document.getElementById('outputText').value = result;
        }

        // Caesar Cipher Implementation
        function caesarCipher(str, shift) {
            return str.replace(/[a-zA-Z]/g, function(c) {
                const base = c < 'a' ? 65 : 97;
                return String.fromCharCode((c.charCodeAt(0) - base + shift + 26) % 26 + base);
            });
        }

        // Atbash Cipher Implementation
        function atbashCipher(str) {
            return str.replace(/[a-zA-Z]/g, function(c) {
                const base = c < 'a' ? 65 : 97;
                return String.fromCharCode(25 - (c.charCodeAt(0) - base) + base);
            });
        }

        // Vigenere Cipher Implementation
        function vigenereCipher(str, key, action) {
            let result = '';
            let keyIndex = 0;
            key = key.toLowerCase();

            for (let i = 0; i < str.length; i++) {
                const c = str[i];
                if (/[a-zA-Z]/.test(c)) {
                    const isUpper = c < 'a';
                    const base = isUpper ? 65 : 97;
                    const shift = key[keyIndex % key.length].charCodeAt(0) - 97;
                    const effectiveShift = action === 'encrypt' ? shift : -shift;

                    const processed = String.fromCharCode((c.charCodeAt(0) - base + effectiveShift + 26) % 26 + base);
                    result += processed;
                    keyIndex++;
                } else {
                    result += c;
                }
            }
            return result;
        }

        function copyOutput() {
            const output = document.getElementById('outputText');
            output.select();
            document.execCommand('copy');
            alert('Hasil berhasil disalin ke clipboard!');
        }
    </script>
</body>
</html>
